name: arbor

services:
  frontend:
    build:
      context: ..
      dockerfile: Arbor/frontend/Dockerfile
    container_name: arbor-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ..
      dockerfile: Arbor/backend/Dockerfile
    container_name: arbor-backend
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://arbor:arbor@postgres:5432/arbor
      SERVER_PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:5173
      RUST_LOG: arbor_backend=debug,tower_http=debug
    volumes:
      - ../backend:/app
      - cargo_registry:/usr/local/cargo/registry
      - backend_target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
    command: cargo run

  postgres:
    image: pgvector/pgvector:pg17
    container_name: arbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arbor
      POSTGRES_USER: arbor
      POSTGRES_PASSWORD: arbor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbor -d arbor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  cargo_registry:
  backend_target:
  postgres_data:
